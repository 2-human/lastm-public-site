<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Walk With Serbia</title>
<meta name="description" content="For 2 years, Serbia didn't leave the streets. This is the last walk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Walk With Serbia — brand token emission (page/site :root target).
   Source of truth: brand/design-tokens/*.md  (derived from studenti.org.rs, light only).
   Rule: no hex anywhere else in this site; alias --brand-* / --ws-* only. */
:root {
  color-scheme: light;

  /* colors — brand/design-tokens/{slug}.md */
  --brand-primary: #a81a32;          /* primary-deep */
  --brand-primary-dark: #7b0f2e;     /* primary-darker */
  --brand-ink: #231f20;              /* neutral-deep */
  --brand-surface: #ffffff;          /* surface-base */
  --brand-surface-soft: #f2f2f2;     /* surface-soft */
  --brand-tint: #e1e8f4;             /* surface-tint — alternating bands */
  --brand-text: #231f20;             /* text-default */
  --brand-text-soft: #585858;        /* text-soft */
  --brand-text-faint: #757575;       /* text-faint */
  --brand-rule: rgba(35, 31, 32, .5);/* rule */
  --brand-link: #a81a32;             /* link */
  --brand-on-primary: #ffffff;
  --brand-on-ink: #ffffff;

  /* category-hues — feed/map source categories (72° wheel from primary) */
  --cat-march: hsl(350 72% 38%);     /* first  — the march itself */
  --cat-media: hsl(206 72% 38%);     /* second — newsrooms */
  --cat-creator: hsl(62 72% 38%);    /* third  — influencers/creators */
  --cat-citizen: hsl(278 72% 38%);   /* fourth — citizens & diaspora walks */
  --cat-org: hsl(134 72% 38%);       /* fifth  — organisations */

  /* typography — font-stack-sans, size-scale */
  --font-sans: 'Golog Text', 'Inter Tight', Arial, sans-serif;
  --fs-display: clamp(2.25rem, 5vw, 3.5rem);
  --fs-h2: 1.75rem;
  --fs-h3: 1.5rem;
  --fs-body: 1rem;
  --fs-small: .875rem;
  --fs-micro: .75rem;
  --lh-tight: 1;
  --lh-body: 1.5;

  /* spacing / shape — radius, container, section-bar */
  --radius-control: .5rem;
  --radius-card: 10px;
  --container: min(70rem, 100% - 2rem);
  --section-bar: .4rem;
  --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem;
  --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem;

  /* header-glass */
  --header-bg: hsla(0 0% 100% / .8);
  --header-blur: 6px;
}

/* ---- base ---- */
html { background: var(--brand-surface); }
body {
  margin: 0; color: var(--brand-text); background: var(--brand-surface);
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-weight: 700; line-height: var(--lh-tight); margin: 0 0 var(--space-4); }
h1 { font-size: var(--fs-display); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }
p { margin: 0 0 var(--space-4); }
a { color: var(--brand-link); text-decoration: underline; }
a:hover { color: var(--brand-primary-dark); }

/* ---- layout: full-bleed bands, centred column (their body grid) ---- */
.band { display: grid; grid-template-columns: 1fr var(--container) 1fr; padding-block: var(--space-12); }
.band > * { grid-column: 2; }
.band.tint { background: var(--brand-tint); }
.band.ink  { background: var(--brand-ink); color: var(--brand-on-ink); }
.band.ink a { color: inherit; }
section h2.bar { border-left: var(--section-bar) solid var(--brand-primary); padding-left: .8rem; }

/* ---- header (sticky glass) ---- */
.site-header { position: sticky; top: 0; z-index: 100; background: var(--header-bg); backdrop-filter: blur(var(--header-blur)); }
.site-header nav { width: var(--container); margin-inline: auto; display: flex; align-items: center; gap: var(--space-4); min-height: 3.5rem; }
.site-header nav a { color: var(--brand-text); text-decoration: none; padding: var(--space-3) var(--space-2); border-bottom: 4px solid transparent; }
.site-header nav a:hover { background: hsla(from var(--brand-tint) h s l / .9); }
.site-header nav a.active { border-bottom-color: var(--brand-primary); }
.site-header .spacer { flex: 1; }

/* ---- buttons (their a.button) ---- */
.button { display: inline-block; cursor: pointer; user-select: none; border-radius: var(--radius-control);
  padding: var(--space-4) var(--space-8); line-height: normal; text-decoration: none; color: var(--brand-text);
  border: 1px solid var(--brand-text); background: transparent; font: inherit; }
.button:hover { border-color: var(--brand-primary); color: var(--brand-text); }
.button:active { color: var(--brand-primary); }
.button.primary { background: var(--brand-primary); color: var(--brand-on-primary); border-color: var(--brand-primary); font-weight: 700; }
.button.primary:hover { background: var(--brand-primary-dark); border-color: var(--brand-primary-dark); color: var(--brand-on-primary); }
.button.small { padding: var(--space-2) var(--space-4); font-size: var(--fs-small); }

/* ---- cards ---- */
.card { background: var(--brand-surface); border-radius: var(--radius-card); overflow: hidden; color: inherit; text-decoration: none; display: block; }
.band:not(.tint) .card { border: 1px solid var(--brand-surface-soft); }
.card .thumb { aspect-ratio: 3 / 2; background: var(--brand-surface-soft); object-fit: cover; width: 100%; display: block; }
.card .thumb.vertical { aspect-ratio: 9 / 16; }
.card .content { padding: var(--space-4); }
.card time, .meta { display: block; font-size: var(--fs-small); color: var(--brand-text-soft); }
.card h3 { font-size: 1.125rem; margin: var(--space-2) 0 var(--space-1); }

/* ---- chips (source category / city) ---- */
.chip { display: inline-flex; align-items: center; gap: .4em; font-size: var(--fs-micro); font-weight: 700; letter-spacing: .02em;
  padding: .2em .6em; border-radius: var(--radius-control); background: var(--brand-surface-soft); color: var(--brand-text-soft); }
.chip::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: var(--dot, var(--brand-text-faint)); }
.chip.march { --dot: var(--cat-march); } .chip.media { --dot: var(--cat-media); } .chip.creator { --dot: var(--cat-creator); }
.chip.citizen { --dot: var(--cat-citizen); } .chip.org { --dot: var(--cat-org); }

/* ---- counters ---- */
.counter { font-size: var(--fs-display); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.counter small { display: block; font-size: var(--fs-small); font-weight: 400; color: var(--brand-text-soft); margin-top: var(--space-2); }

/* ---- lists / rules ---- */
.article-list > * + * { border-top: 1px solid var(--brand-rule); padding-top: var(--space-4); margin-top: var(--space-4); }

/* ---- footer ---- */
.site-footer { background: var(--brand-ink); color: var(--brand-on-ink); padding: var(--space-8) var(--space-4); text-align: center; font-size: var(--fs-small); }
.site-footer a { color: inherit; }

@media (max-width: 720px) { .band { padding-block: var(--space-8); } }

/* Walk With Serbia — three-column app layout. Colours/fonts only from tokens.css (inlined before this). */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 56px; min-height: calc(100vh - 3.5rem); }
.layout.chat-open { grid-template-columns: minmax(0, 1fr) 320px; }
main.content { padding: var(--space-8) var(--space-8) var(--space-12); min-width: 0; width: 100%; max-width: 1120px; margin-inline: auto; box-sizing: border-box; }
main.content > section + section { margin-top: var(--space-12); }
.band.tint { background: var(--brand-tint); border-radius: var(--radius-card); padding: var(--space-6); }
.band { display: block; padding: 0; }
.band > * { grid-column: auto; }
.chat { box-sizing: border-box; position: sticky; top: 3.5rem; height: calc(100vh - 3.5rem); border-left: 1px solid var(--brand-surface-soft); width: 56px; transition: width .2s; display: flex; flex-direction: column; align-items: center; padding-top: var(--space-4); }
.chat.open { width: auto; align-items: stretch; padding: var(--space-6); }
.chat .toggle { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--brand-primary); color: var(--brand-on-primary); cursor: pointer; display: grid; place-items: center; }
.chat .toggle svg { width: 22px; height: 22px; fill: currentColor; }
.chat .toggle-label { font-size: var(--fs-micro, .7rem); color: var(--brand-primary); margin-top: var(--space-1); font-weight: 600; }
.chat.open .toggle-label { display: none; }
.chat .panel { display: none; }
.chat.open .panel { display: block; }
.chat.open .toggle { position: absolute; top: var(--space-4); right: var(--space-4); width: 32px; height: 32px; }
.chat .panel h3 { margin-top: var(--space-8); }
.chat .panel .button { width: 100%; text-align: center; box-sizing: border-box; }
.chat .faint { font-size: var(--fs-small); }

.hero h1 { font-size: clamp(2rem, 3.6vw, 3rem); }
.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); align-items: center; }
.lede { font-size: 1.125rem; max-width: 40rem; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.faint { color: var(--brand-text-soft); }
.prose { max-width: 44rem; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); }
.video.ph { background: var(--brand-ink); color: var(--brand-on-ink); border-radius: var(--radius-card); display: grid; place-items: center; aspect-ratio: 16 / 9; font-size: var(--fs-small); }
.today { display: grid; grid-template-columns: 1fr 2fr; gap: var(--space-8); align-items: start; }
.counter.big { font-size: clamp(3rem, 6vw, 5rem); }
.counter.election { font-size: clamp(1.9rem, 4vw, 3rem); white-space: nowrap; }
.counter.election .n { font-variant-numeric: tabular-nums; }
.counter.election .u { font-size: .45em; font-weight: 500; margin-right: .15em; }
.counter.election .tz { font-size: var(--fs-small); color: var(--brand-ink-soft, inherit); }
.counter.election small { white-space: normal; line-height: 1.4; }
.program li b { display: inline-block; min-width: 3.6rem; font-variant-numeric: tabular-nums; }
.counters { margin: var(--space-4) 0 var(--space-6); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
.counters.small .counter { font-size: var(--fs-h2); }
.map { width: 100%; border-radius: var(--radius-card); background: var(--brand-surface-soft); }
.map-grid { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-8); }
ul.plain { list-style: none; padding: 0; margin: 0; }
ul.plain li { padding: var(--space-2) 0; border-bottom: 1px solid var(--brand-surface-soft); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4); }
.cards.people { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.card { border: 1px solid var(--brand-surface-soft); cursor: pointer; }
.card .thumb.ph { display: grid; place-items: center; color: var(--brand-text-soft); font-size: var(--fs-small); }
.card .thumb.round { aspect-ratio: 1; border-radius: 50%; width: 96px; margin: var(--space-4) auto 0; }
.card .text { margin: var(--space-2) 0; font-size: var(--fs-small); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { font-size: var(--fs-small); display: flex; flex-wrap: wrap; gap: var(--space-1); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-3); margin: var(--space-2) 0 0; font-size: var(--fs-small); }
.legend .chip.route { --dot: var(--cat-march); } .legend .chip.walked { --dot: var(--cat-citizen); }
.open-original { display: flex; flex-wrap: wrap; gap: var(--space-3); font-size: var(--fs-small); margin-top: var(--space-2); }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3); margin: var(--space-4) 0 var(--space-6); padding: var(--space-4); background: var(--brand-surface-soft); border-radius: var(--radius-card); }
.filters label { display: flex; flex-direction: column; gap: var(--space-1); font-size: var(--fs-micro); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--brand-text-soft); }
.filters input, .filters select { font: inherit; font-size: var(--fs-small); padding: var(--space-2); border: 1px solid var(--brand-rule); border-radius: var(--radius-control); background: var(--brand-surface); color: var(--brand-text); }
.filters .cities { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.filters .cities .chip { cursor: pointer; border: 1px solid var(--brand-rule); background: var(--brand-surface); padding: .45em .8em; font-size: var(--fs-small); }
.filters .cities .chip.on { border-color: var(--brand-primary); background: var(--brand-primary); color: var(--brand-on-primary); --dot: var(--brand-on-primary); }
.filters .reset { align-self: end; }
.post-full .embeds { display: grid; gap: var(--space-6); max-width: 560px; }
.embed.yt { aspect-ratio: 16 / 9; } .embed.yt iframe { width: 100%; height: 100%; border: 0; border-radius: var(--radius-card); }
.embed.link { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3); border: 1px solid var(--brand-rule); border-radius: var(--radius-card); text-decoration: none; }
.embed.link img { width: 96px; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius-control); }
.post-full video, .post-full img.media { max-width: 560px; width: 100%; border-radius: var(--radius-card); }
.page-head { display: grid; grid-template-columns: 240px 1fr; gap: var(--space-8); align-items: start; margin-bottom: var(--space-8); }
.page-head img, .page-head .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-card); background: var(--brand-surface-soft); display: grid; place-items: center; color: var(--brand-text-faint); }
.page-head .meta { font-size: var(--fs-small); }
.crumb { font-size: var(--fs-small); margin-bottom: var(--space-2); }
.search { width: 100%; box-sizing: border-box; font: inherit; padding: var(--space-3); border: 1px solid var(--brand-rule); border-radius: var(--radius-control); margin: var(--space-4) 0; }
.timeline { padding-left: 1.2rem; max-width: 44rem; } .timeline li { margin-bottom: var(--space-3); } .timeline b { display: inline-block; min-width: 9rem; }
.press-list { display: flex; flex-direction: column; gap: var(--space-2); }
.press-item { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); background: var(--brand-surface-soft); border-radius: var(--radius-card); padding: var(--space-3) var(--space-4); }
.press-item .meta { display: block; font-size: var(--fs-small); }
.quotes li { margin-bottom: var(--space-2); }
.notice { background: var(--brand-tint); border-radius: var(--radius-card); padding: var(--space-4); }
.loading { color: var(--brand-text-faint); padding: var(--space-12); text-align: center; }
.leaflet-container { font: inherit; }
@media (max-width: 820px) {
  .layout, .layout.chat-open { grid-template-columns: 1fr; }
  .chat { position: fixed; right: var(--space-4); bottom: var(--space-4); top: auto; height: auto; width: auto; border: 0; padding: 0; z-index: 50; }
  .chat .toggle-label { display: none; }
  .chat.open { left: var(--space-4); width: auto; max-width: 360px; margin-left: auto; box-sizing: border-box; background: var(--brand-surface); border: 1px solid var(--brand-rule); border-radius: var(--radius-card); padding: var(--space-6); }
  .hero-grid, .today, .two, .map-grid, .page-head { grid-template-columns: 1fr; }
  .counters { grid-template-columns: 1fr 1fr; }
  main.content { padding: var(--space-6) var(--space-4); }
  .site-header nav { width: auto; padding-inline: var(--space-3); flex-wrap: nowrap; overflow-x: auto; gap: var(--space-1); padding-block: var(--space-2); scrollbar-width: none; }
  .site-header nav::-webkit-scrollbar { display: none; }
  .site-header nav > * { flex: none; white-space: nowrap; }
  .site-header .spacer { flex: 1 0 var(--space-2); }
  .site-header nav a.brand { font-weight: 700; }
}


/* preview gate (the site is behind the same Firebase sign-in as the CMS until launch) */
.gate { position: fixed; inset: 0; background: var(--brand-surface-soft); display: grid; place-items: center; z-index: 200; padding: var(--space-4); }
.gate[hidden] { display: none; }
.gate .box { background: var(--brand-surface); border-radius: var(--radius-card); padding: var(--space-8); width: min(380px, 92vw); box-sizing: border-box; }
.gate h2 { margin-top: 0; }
.gate form { display: flex; flex-direction: column; gap: var(--space-3); }
.gate .fld { display: flex; flex-direction: column; gap: var(--space-1); font-weight: 600; font-size: var(--fs-small); }
.gate input { font: inherit; padding: .55em .7em; border: 1px solid var(--brand-surface-soft); border-radius: 8px; }
.gate .linkish { background: none; border: 0; color: var(--brand-primary); cursor: pointer; font: inherit; text-decoration: underline; padding: 0; align-self: flex-start; }
.gate .gmsg { font-size: var(--fs-small); color: var(--brand-text-soft, inherit); min-height: 1.2em; margin-top: var(--space-3); }
.site-header .signout { background: none; border: 0; color: inherit; opacity: .6; cursor: pointer; font: inherit; font-size: var(--fs-small); text-decoration: underline; margin-left: var(--space-3); }
.site-header .signout[hidden] { display: none; }

/* press kit */
.pk-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-6); flex-wrap: wrap; }
.pk-head h1 { margin: 0 0 var(--space-2); }
.pk-meta { text-align: right; font-size: var(--fs-small); margin: var(--space-2) 0 0; }
.pk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-3); margin-top: var(--space-6); }
.pk-stats .stat { background: var(--brand-surface-soft); border-radius: var(--radius-card); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); }
.pk-stats .stat b { font-size: var(--fs-h2); line-height: 1.1; font-variant-numeric: tabular-nums; }
.pk-stats .stat span { font-size: var(--fs-small); }
.pk-block { border-top: 2px solid var(--brand-surface-soft); padding-top: var(--space-6); margin-top: var(--space-8); }
.pk-block h2 { margin: 0 0 var(--space-4); }
.pk-block h2 a { color: inherit; }
.pk-block.latest { border-top-color: var(--brand-primary); }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: var(--fs-small); font-weight: 700; color: var(--brand-primary); margin: 0 0 var(--space-1); }
.pk-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3); }
.pk-tiles .tile { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); background: var(--brand-surface-soft); border-radius: var(--radius-card); padding: var(--space-4); font-weight: 700; font-size: var(--fs-h3); color: inherit; text-decoration: none; }
.pk-tiles a.tile:hover { outline: 2px solid var(--brand-primary); }
.pk-tiles .tile.off { opacity: .55; }
.pk-tiles .tile small { font-weight: 400; font-size: var(--fs-small); }
.pk-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin: var(--space-4) 0 0; flex-wrap: wrap; }
.res-icons { display: inline-flex; gap: var(--space-2); flex: none; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--brand-primary); color: var(--brand-on-primary); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.off { background: var(--brand-surface-soft); color: inherit; opacity: .45; }
a.icon-btn:hover { filter: brightness(.9); }
.pk-days { list-style: none; padding: 0; margin: 0; }
.pk-days li { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--brand-surface-soft); }
.pk-days li > a { color: inherit; text-decoration: none; flex: 1; min-width: 0; }
.pk-days li > a:hover b { color: var(--brand-primary); }
.pk-days .what { display: block; font-size: var(--fs-small); opacity: .75; }
.pk-foot { align-items: start; }
.timeline.compact { gap: var(--space-2); margin: var(--space-3) 0 0; }
.timeline.compact h3 { margin: 0; }
.button.disabled { opacity: .5; pointer-events: none; }
.timeline { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--space-4); }
.timeline li { display: grid; grid-template-columns: 4.5rem 1fr; gap: var(--space-3); border-left: 3px solid var(--brand-primary); padding-left: var(--space-3); }
.timeline time { font-weight: 700; font-variant-numeric: tabular-nums; }
.timeline h3 { margin: 0 0 var(--space-1); font-size: var(--fs-body); }
.timeline .meta { margin: 0 0 var(--space-1); font-size: var(--fs-small); }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-2); margin-top: var(--space-4); }
.media-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }

.pk-block .lead, .presskit .lead { font-size: var(--fs-body); max-width: 68ch; margin: 0 0 var(--space-4); }
.pk-block.day h2, .pk-block.ann h2 { margin-bottom: var(--space-2); }
.pk-block.day h2 a, .pk-block.ann h2 a { text-decoration: none; }
.pk-block.day h2 a:hover, .pk-block.ann h2 a:hover { color: var(--brand-primary); }
.pk-links { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); margin: 0 0 var(--space-4); font-weight: 700; }
.pk-links a, .pk-links .off { display: inline-flex; align-items: center; gap: var(--space-2); color: inherit; text-decoration: none; }
.pk-links a:hover { color: var(--brand-primary); }
.pk-links .off { opacity: .4; font-weight: 500; }
.pk-links svg { width: 22px; height: 22px; flex: none; }

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getFirestore, connectFirestoreEmulator, collection, getDocs, query, where, doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import { getAuth, connectAuthEmulator, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

// ---- social-links.js (shared, inlined by build-site.py) ----
// Social-media link parser shared by the CMS (browser) and the Node scripts (seed, topics).
// One pasted URL -> { platform, url, handle, id, profileUrl, thumb, personSlug }.
// No network calls here: thumbnails that need a request (TikTok oEmbed) are fetched by the caller.
const PLATFORMS = { instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube', x: 'X', facebook: 'Facebook', link: 'Link' };

function personSlug(platform, handle) {
  if (!handle) return null;
  const h = String(handle).toLowerCase().replace(/^@/, '').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9._-]+/g, '-').replace(/^-|-$/g, '');
  return h ? `${platform}-${h}` : null;
}

function parseSocialUrl(input) {
  let u;
  try { u = new URL(String(input).trim()); } catch { return null; }
  const host = u.hostname.replace(/^(www|m|mobile)\./, '');
  const parts = u.pathname.split('/').filter(Boolean);
  const out = { platform: 'link', url: u.href, handle: null, id: null, profileUrl: null, thumb: null };

  if (/(^|\.)instagram\.com$/.test(host)) {
    out.platform = 'instagram';
    const i = parts.findIndex(p => ['p', 'reel', 'reels', 'tv'].includes(p));
    if (i > 0) out.handle = parts[0];
    if (i >= 0) out.id = parts[i + 1] || null;
    if (!out.id && parts.length === 1) out.handle = parts[0];           // a profile link
    out.url = `https://www.instagram.com/${i >= 0 ? `${parts[i] === 'reels' ? 'reel' : parts[i]}/${out.id}/` : `${parts[0]}/`}`;
  } else if (/(^|\.)tiktok\.com$/.test(host)) {
    out.platform = 'tiktok';
    const at = parts.find(p => p.startsWith('@'));
    out.handle = at ? at.slice(1) : null;
    const v = parts.indexOf('video');
    out.id = v >= 0 ? parts[v + 1] : null;
    if (/^t\.|vm\./.test(u.hostname)) out.id = null;                     // short links need a resolve; keep as pasted
  } else if (/(^|\.)(youtube\.com|youtu\.be)$/.test(host)) {
    out.platform = 'youtube';
    if (host === 'youtu.be') out.id = parts[0] || null;
    else if (parts[0] === 'shorts' || parts[0] === 'embed' || parts[0] === 'live') out.id = parts[1] || null;
    else out.id = u.searchParams.get('v');
    const at = parts.find(p => p.startsWith('@'));
    if (at) out.handle = at.slice(1);
    if (out.id) { out.url = `https://www.youtube.com/watch?v=${out.id}`; out.thumb = `https://i.ytimg.com/vi/${out.id}/hqdefault.jpg`; }
  } else if (/(^|\.)(x\.com|twitter\.com)$/.test(host)) {
    out.platform = 'x';
    const s = parts.indexOf('status');
    if (s > 0) { out.handle = parts[0]; out.id = parts[s + 1] || null; }
    else if (parts.length === 1) out.handle = parts[0];
    if (out.handle && out.id) out.url = `https://x.com/${out.handle}/status/${out.id}`;
  } else if (/(^|\.)(facebook\.com|fb\.watch)$/.test(host)) {
    out.platform = 'facebook';
    if (host === 'fb.watch') out.id = parts[0] || null;
    else if (parts[0] === 'reel' || parts[0] === 'watch') out.id = parts[1] || u.searchParams.get('v');
    else if (parts[0] === 'share') out.id = parts[2] || parts[1] || null;
    else if (parts.length) { out.handle = parts[0] === 'profile.php' ? null : parts[0]; const k = parts.findIndex(p => ['posts', 'videos', 'photos', 'reels'].includes(p)); if (k > 0) out.id = parts[k + 1] || null; }
  } else {
    out.handle = host;
  }

  if (out.handle) {
    out.handle = out.handle.replace(/^@/, '');
    out.profileUrl = { instagram: `https://www.instagram.com/${out.handle}/`, tiktok: `https://www.tiktok.com/@${out.handle}`,
      youtube: `https://www.youtube.com/@${out.handle}`, x: `https://x.com/${out.handle}`, facebook: `https://www.facebook.com/${out.handle}`,
      link: `https://${out.handle}/` }[out.platform];
  }
  out.personSlug = out.platform === 'link' ? null : personSlug(out.platform, out.handle);
  return out;
}

// Embed HTML for the public site: official widgets, no API keys. The caller loads the platform script once (loadEmbedScript).
function embedHtml(s) {
  if (!/^https?:\/\//i.test(String(s?.url || ''))) return '';
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  switch (s.platform) {
    case 'youtube': return s.id ? `<div class="embed yt"><iframe src="https://www.youtube-nocookie.com/embed/${esc(s.id)}" title="YouTube video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>` : linkCard(s, esc);
    case 'instagram': return s.id ? `<blockquote class="instagram-media" data-instgrm-permalink="${esc(s.url)}" data-instgrm-version="14"><a href="${esc(s.url)}">Instagram post${s.handle ? ' by @' + esc(s.handle) : ''}</a></blockquote>` : linkCard(s, esc);
    case 'tiktok': return s.id ? `<blockquote class="tiktok-embed" cite="${esc(s.url)}" data-video-id="${esc(s.id)}"><section><a href="${esc(s.url)}">TikTok${s.handle ? ' by @' + esc(s.handle) : ''}</a></section></blockquote>` : linkCard(s, esc);
    case 'x': return s.id ? `<blockquote class="twitter-tweet" data-dnt="true"><a href="${esc(s.url)}">Post on X${s.handle ? ' by @' + esc(s.handle) : ''}</a></blockquote>` : linkCard(s, esc);
    case 'facebook': return `<div class="embed fb"><iframe src="https://www.facebook.com/plugins/post.php?href=${encodeURIComponent(s.url)}&show_text=true&width=500" width="500" height="600" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" loading="lazy"></iframe></div>`;
    default: return linkCard(s, esc);
  }
}
function linkCard(s, esc) {
  return `<a class="embed link" href="${esc(s.url)}" target="_blank" rel="noopener">${s.thumb ? `<img src="${esc(s.thumb)}" alt="">` : ''}<span>${esc(s.handle || s.url)}</span></a>`;
}

const SCRIPTS = { instagram: 'https://www.instagram.com/embed.js', tiktok: 'https://www.tiktok.com/embed.js', x: 'https://platform.twitter.com/widgets.js' };
const loaded = {};
// Loads (once) the widget script for a platform and asks it to process new blockquotes. Browser only.
function loadEmbedScript(platform) {
  const src = SCRIPTS[platform]; if (!src || typeof document === 'undefined') return;
  if (loaded[platform]) {

  main.innerHTML = `${demoNote()}<section><p class="crumb"><a href="${isAnn ? '#/press' : `#/press/${d.day}`}">‹ Back to the Press Kit</a></p>
  <div class="drive" role="region" aria-label="Simulated Drive folder"><div class="drive-bar"><span class="drive-path">Shared with me › Walk With Serbia · Press › <b>${esc(name)}</b></span><span class="drive-tools"><span class="faint">${files.length} files</span><a class="button small" href="${esc((isAnn ? D.press.kit.zipUrl : d.zipUrl) || '#')}" target="_blank" rel="noopener">Download all</a></span></div>
  <table class="drive-list"><thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Modified</th></tr></thead><tbody>${files.map(([f, icon, type, size, note]) => `<tr><td><span class="fname">${ico(icon)}${esc(f)}</span>${note ? `<small>${esc(note)}</small>` : ''}</td><td>${type}</td><td>${size}</td><td>${esc(fmtDT(when))}</td></tr>`).join('')}</tbody></table></div>
  <p class="faint">This is a simulation of the Google Drive folder that the Browse button opens. Naming scheme: <code>${p}-${text}</code>, <code>${p}-imageNNN</code>, <code>${p}-videoNNN</code>, <code>${p}-mediamanifest</code>.</p></section>`;
}
function vPressRelease() {
  const k = pressKit();
  main.innerHTML = `<section><p class="crumb"><a href="#/press">Press Kit</a> › Press release</p><p class="eyebrow">Official announcement</p><h1>${esc(k.title || 'Walk With Serbia: the last walk begins on 10 October')}</h1>${k.lead ? `<p class="lead">${esc(k.lead)}</p>` : ''}<div class="prose">${paragraphs(k.intro)}</div>
  <div class="two"><div><h3>Key facts</h3><ul>${(k.facts || []).map(f => `<li>${esc(f)}</li>`).join('')}</ul></div><div><h3>Quotes ready to use</h3><ul class="quotes">${(k.quotes || []).map(q => `<li>“${esc(q)}”</li>`).join('')}</ul></div></div>
  <p class="row">${safe(k.pdfUrl) ? `<a class="button" ${ext(k.pdfUrl)}>Two years in one page (PDF)</a>` : ''}${safe(k.visualUrl) ? ` <a class="button" ${ext(k.visualUrl)}>Key visual + logo</a>` : ''}</p>${dlRow(k.zipUrl, k.driveUrl, 'the announcement')}</section>
<section><h2 class="bar">Rules of use</h2><div class="prose">${paragraphs(k.rules)}</div>
<h2 class="bar" style="margin-top:2rem">Media contact</h2><p>${esc(k.contactHours || '')}<br><a href="mailto:${esc(k.contactEmail || '')}">${esc(k.contactEmail || '')}</a></p></section>`;
}
function vPressDay(id, flag) {
  const d = D.press[id]; if (!d || id === 'kit') { main.innerHTML = '<p class="notice">This press day was not found.</p>'; return; }
  const posts = dayPosts(d);
  const TYPES = { video: 'video', image: 'photo', pdf: 'PDF', zip: 'ZIP' };
  const item = i => `<div class="press-item"><div><b>${esc(i.title)}</b><span class="meta">${[TYPES[i.type] || i.type, i.orientation, i.res, i.duration, i.music === false ? 'no music' : ''].filter(Boolean).map(esc).join(' · ')}${i.city ? ' · ' + esc(D.cities[i.city]?.name || i.city) : ''} · CC BY 4.0</span></div>${safe(i.url) ? `<a class="button small" ${ext(i.url)}>Download ↓</a>` : '<span class="faint">file not uploaded yet</span>'}</div>`;
  const hm = t => t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const upd = p => { const c = p.city && D.cities[p.city]; return `<li><time>${esc(hm(p.at))}</time><div><h3>${p.demo ? esc(p.title) : `<a href="#/post/${esc(p.id)}">${esc(p.title)}</a>`}</h3>${c ? `<p class="meta"><a href="#/city/${esc(c.slug)}">${esc(c.name)}</a></p>` : ''}${p.text ? paragraphs(p.text) : ''}</div></li>`; };
  const thumbs = posts.map(p => { const t = thumbOf(p); return safe(t) ? `<a href="#/post/${esc(p.id)}" title="${esc(p.title)}"><img src="${esc(t)}" alt="${esc(p.title)}" loading="lazy"></a>` : ''; }).join('');
  main.innerHTML = `${demoNote()}<section><p class="crumb"><a href="#/press/${d.day}">Press Kit</a> › ${dayTitle(d)}</p><p class="eyebrow">${dayTitle(d)}${d.date ? ` · ${esc(fmtD(new Date(d.date + 'T00:00:00')))}` : ''}</p><h1>${esc(d.title || dayTitle(d) + ': recap')}</h1>
  ${contents([['doc', 'Full recap'], ['play', 'Video'], ['image', 'Images'], ['clock', 'Timeline']])}${dlRow(d.zipUrl, d.galleryUrl, dayTitle(d))}
  <div class="prose">${d.bullets ? paragraphs(d.bullets) : '<p class="faint">The recap of the day is written in the evening.</p>'}</div></section>
<section id="pressTimeline"><h2 class="bar">Timeline updates <span class="faint">· ${plural(posts.length, 'update')}</span></h2>${posts.length ? `<ol class="timeline">${posts.map(upd).join('')}</ol>` : '<p class="faint">No live updates from this day yet.</p>'}</section>
<section id="pressMedia"><h2 class="bar">Media gallery</h2>
  <div class="press-list">${(d.items || []).map(item).join('')}</div>${thumbs ? `<div class="media-grid">${thumbs}</div>` : ''}${!(d.items || []).length && !thumbs && !safe(d.galleryUrl) ? '<p class="faint">Media from this day follows.</p>' : ''}</section>`;
  if (flag) setTimeout(() => { const el = document.getElementById(flag === '/timeline' ? 'pressTimeline' : 'pressMedia'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70 }); }, 120);   // after the router's scroll-to-top; 70 px = sticky header
}

// ── walks ──
const walkState = w => { const d = String(w.date || ''), today = new Date().toISOString().slice(0, 10); return !d ? 'undated' : d === today ? 'today' : d > today ? 'upcoming' : 'past'; };
const routePts = r => [r?.start, ...(r?.via || []), r?.end].filter(p => p && Number.isFinite(+p.lat) && Number.isFinite(+p.lng));
const fmtWalkWhen = w => [w.date ? fmtD(new Date(w.date + 'T00:00:00')) : '', w.time].filter(Boolean).join(' · ');
const walkRow = w => { const c = D.cities[w.city]; return `<li><a href="#/walk/${esc(w.id)}"><b>${esc(w.title)}</b></a> <span class="faint">${esc(fmtWalkWhen(w))}${c ? ' · ' + esc(c.name) : ''}${w.km ? ' · ' + w.km + ' km' : ''}</span></li>`; };
function walkMap(el, w, city) {
  if (!window.L) return; const pts = routePts(w.route);
  const map = L.map(el, { scrollWheelZoom: false }); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
  const css = getComputedStyle(document.documentElement); const red = css.getPropertyValue('--cat-march').trim();
  pts.forEach((p, i) => L.circleMarker([+p.lat, +p.lng], { radius: 7, color: i === 0 ? '#1f7a4d' : i === pts.length - 1 && pts.length > 1 ? red : '#2f5f9e', fillOpacity: 1 }).bindPopup(`<b>${i === 0 ? 'Start' : i === pts.length - 1 && pts.length > 1 ? 'End' : 'Via'}</b> ${esc(p.name || '')}`).addTo(map));
  if (pts.length > 1) L.polyline(pts.map(p => [+p.lat, +p.lng]), { color: red, weight: 4 }).addTo(map);
  if (pts.length) map.fitBounds(pts.map(p => [+p.lat, +p.lng]), { padding: [30, 30], maxZoom: 15 }); else if (city) map.setView([city.lat, city.lng], 12);
}
async function vWalk(id) {
  const w = D.walks[id]; if (!w) { main.innerHTML = '<p class="notice">Walk not found.</p>'; return; }
  const c = D.cities[w.city]; const mine = D.posts.filter(p => p.walk === id); const pts = routePts(w.route);
  const who = (w.people || []).map(s => D.people[s]).filter(Boolean), topics = (w.topics || []).map(s => D.topics[s]).filter(Boolean);
  const state = walkState(w); const label = { today: 'Today', upcoming: 'Upcoming', past: 'Walked', undated: 'Date to be announced' }[state];
  main.innerHTML = `<section><p class="crumb"><a href="#/map">Map</a>${c ? ` › <a href="#/city/${esc(c.slug)}">${esc(c.name)}</a>` : ''} › walk</p>
  <div class="page-head"><div id="walkImg" class="ph"><span>${esc(w.title)}</span></div><div><h1>${esc(w.title)}</h1>
    <p class="row"><span class="chip ${state === 'past' || state === 'today' ? 'citizen' : ''}">${label}</span><span class="faint">${esc(fmtWalkWhen(w))}</span></p>
    <div class="counters small"><div class="counter">${w.km || 0}<small>km</small></div><div class="counter">${pts.length}<small>${pts.length === 1 ? 'route point' : 'route points'}</small></div><div class="counter">${mine.length}<small>${mine.length === 1 ? 'post' : 'posts'}</small></div></div>
    ${pts.length ? `<p class="meta">From <b>${esc(pts[0].name || '')}</b>${pts.length > 1 ? ` to <b>${esc(pts[pts.length - 1].name || '')}</b>` : ''}${pts.length > 2 ? ` via ${pts.slice(1, -1).map(p => esc(p.name || '')).join(', ')}` : ''}</p>` : ''}
    <div class="prose">${paragraphs(w.description)}</div>
    <p class="meta">${who.map(x => `<a class="chip creator" href="#/person/${esc(x.slug)}">${esc(whoName(x))}</a> `).join('')}${topics.map(t => `<a class="chip" href="#/topic/${esc(t.slug)}">${esc(t.title)}</a> `).join('')}</p>
  </div></div>
  <div id="map" class="map" style="height:360px;margin-bottom:.5rem"></div><p class="legend"><span class="chip" style="--dot:#1f7a4d">Start</span><span class="chip" style="--dot:#2f5f9e">Via</span><span class="chip route">End · route</span></p>
  <h2 class="bar" style="margin-top:2rem">Posts from this walk</h2>${cards(mine, undefined, 'No posts from this walk yet.')}</section>`;
  walkMap($('#map'), w, c);
  const img = safe(w.cover) || (c ? await wikiImage(c) : ''); const box = $('#walkImg'); if (!box) return;
  if (img) box.outerHTML = `<img src="${esc(img)}" alt="${esc(w.title)}">`;
}
function cityWalksHtml(slug) {
  const ws = Object.values(D.walks).filter(w => slug === undefined || w.city === slug).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const g = { today: [], upcoming: [], past: [], undated: [] }; ws.forEach(w => g[walkState(w)].push(w));
  const sec = (title, list) => list.length ? `<h3>${title}</h3><ul class="plain">${list.map(walkRow).join('')}</ul>` : '';
  return sec('Today', g.today) + sec('Upcoming walks', g.upcoming) + sec('Past walks', g.past.reverse()) + sec('Walks without a date yet', g.undated) || '<p class="faint">No walks recorded for this city yet.</p>';
}
function vWalks() {
  main.innerHTML = `<section><h1>Walks</h1><p class="lede">Every walk recorded so far: today's, the announced ones and the ones already walked. Open a walk for its route, people and posts.</p>${cityWalksHtml(undefined)}</section>`;
}

// ── router ──
const ROUTES = [[/^\/?$/, vHome, 'home'], [/^\/feed$/, vFeed, 'feed'], [/^\/map$/, vMap, 'map'], [/^\/walks$/, vWalks, 'map'], [/^\/press$/, vPress, 'press'], [/^\/press\/(\d+)$/, vPress, 'press'], [/^\/press\/release$/, vPressRelease, 'press'], [/^\/press\/folder\/([a-z0-9-]+)$/, vPressFolder, 'press'], [/^\/press\/(day-[a-z0-9-]+)(\/media|\/timeline)?$/, vPressDay, 'press'], [/^\/people$/, vPeople, ''], [/^\/topics$/, vTopics, ''],
  [/^\/post\/(.+)$/, vPost, 'feed'], [/^\/city\/(.+)$/, vCity, 'map'], [/^\/walk\/(.+)$/, vWalk, 'map'], [/^\/person\/(.+)$/, vPerson, ''], [/^\/topic\/(.+)$/, vTopic, '']];
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
  for (const [re, fn, nav] of ROUTES) { const m = h.match(re); if (m) { document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === nav)); fn(m[1], m[2]); window.scrollTo(0, 0); return; } }
  location.hash = '#/';
}
document.addEventListener('click', e => { const c = e.target.closest('[data-go]'); if (c && !e.target.closest('a')) location.hash = c.dataset.go; });
const chatOpen = v => { $('#chat').classList.toggle('open', v); document.querySelector('.layout').classList.toggle('chat-open', v); };
$('#chatToggle').onclick = () => chatOpen(!$('#chat').classList.contains('open'));
$('#footer').innerHTML = `<p><strong>${esc(SITE.name)}</strong> · ${esc(SITE.domestic)}</p><p>${esc(SITE.license)}</p><p>Media: <a href="mailto:${esc(SITE.media_contact.email)}">${esc(SITE.media_contact.email)}</a> · daily press drop ${esc(SITE.press_time)}</p><p><a href="${esc(SITE.movement_site)}">studenti.org.rs</a> · ${esc(SITE.hashtag)}</p><p>Browse: <a href="#/walks">Walks</a> · <a href="#/people">People</a> · <a href="#/topics">Topics</a></p><p><button type="button" class="linkish" data-signout>Sign out of the preview</button></p>`;

// ── preview gate ──
const gate = $('#gate'), gateMsg = $('#gateMsg');
const showGate = (state, text) => { gate.hidden = false; gate.dataset.state = state; $('#gateForm').hidden = state !== 'login'; $('#gateDenied').hidden = state !== 'denied'; gateMsg.textContent = text || (state === 'login' ? '' : 'Loading…'); };
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#gEmail').value.trim(), pw = $('#gPass').value;
  if (!email || !pw) { gateMsg.textContent = 'Enter your email and password.'; return; }
  $('#gSubmit').disabled = true; gateMsg.textContent = 'Signing in…';
  try { await signInWithEmailAndPassword(auth, email, pw); }
  catch (err) { gateMsg.textContent = /invalid|wrong|not-found|credential/i.test(err.code || '') ? 'Wrong email or password.' : err.code === 'auth/too-many-requests' ? 'Too many attempts: wait a few minutes or reset the password.' : 'Sign-in failed: ' + (err.code || err.message); }
  finally { $('#gSubmit').disabled = false; }
});
$('#gForgot').addEventListener('click', async () => {
  const email = $('#gEmail').value.trim();
  if (!email) { gateMsg.textContent = 'Type your email, then click "Forgot password".'; return; }
  try { await sendPasswordResetEmail(auth, email, { url: location.origin + location.pathname, handleCodeInApp: false }); gateMsg.textContent = 'If the account exists, a password-reset email is on its way.'; }
  catch (err) { gateMsg.textContent = 'Could not send the email: ' + err.code; }
});
document.addEventListener('click', e => { if (e.target.closest('[data-signout]')) signOut(auth); });   // delegated: the header, the gate and the footer each carry one
let started = false;
if (!auth) { showGate('denied', 'The site is not connected to its database yet (no Firebase config for this environment).'); }
else onAuthStateChanged(auth, async user => {
  if (!user) { if (started) { location.reload(); return; } showGate('login'); return; }
  showGate('loading', `Signed in as ${user.email}. Checking access…`);
  let prof = null;
  try { const snap = await getDoc(doc(db, 'profiles', user.uid)); prof = snap.exists() ? snap.data() : null; }
  catch (err) { showGate('denied', 'Could not check your access: ' + (err.code || err.message)); return; }
  if (!prof || prof.active !== true) { showGate('denied', `Signed in as ${user.email}, but this account has no access to the preview. Ask the team.`); return; }
  gateMsg.textContent = 'Loading…'; started = true; gate.hidden = true; document.querySelector('.site-header .signout').hidden = false;
  boot();
});
async function boot() {
  if (!await load()) return;
  if (DEMO.on) applyPressDemo();
  const tg = D.settings.telegram || SITE.telegram || '';
  $('#tgLink').href = tg ? (tg.startsWith('http') ? tg : `https://t.me/${tg.replace(/^@/, '')}`) : '#';
  if (!tg) { $('#tgLink').textContent = 'Email the team'; $('#tgLink').href = `mailto:${SITE.media_contact.email}`; $('#chat .panel p.faint').textContent = 'The Telegram line opens on launch day. Until then, write to the team by email: questions about a walk, footage to send, a request from a newsroom.'; }
  $('#tgHours').textContent = `Operators answer in English, from ${SITE.press_time}; during the march within the hour.`;
  window.addEventListener('hashchange', route); route();
}

</script>
</body>
